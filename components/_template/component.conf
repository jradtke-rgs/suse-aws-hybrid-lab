# =============================================================================
# component.conf - the manifest democtl reads to discover this component
# =============================================================================
# Plain KEY=value lines. democtl parses this file, it does NOT source it, so
# nothing here executes at discovery time. Quotes are optional and stripped;
# a # after whitespace starts a comment.
# =============================================================================

# Must match the directory name. democtl refuses to load a component where
# the two disagree, because every other reference to it uses the directory.
NAME=__COMPONENT_NAME__

# One line. Shown by `democtl list` and in dry-run plans.
DESCRIPTION="Describe what this component deploys"

# Coarse ordering, lower runs first. This is only a TIE-BREAKER between
# components that do not depend on each other - DEPENDS_ON is the real
# constraint. Convention: foundation 10, rancher-manager 20, products 30+.
ORDER=50

# Space-separated component names that must be deployed before this one.
# democtl topologically sorts on this, pulls dependencies in automatically,
# and destroys in reverse. It also refuses to build when an enabled
# component depends on a disabled one.
DEPENDS_ON="foundation"

# false: deploys only when ENABLE_VAR is true in terraform.tfvars.
# true:  always deploys, and ENABLE_VAR is ignored. Note that MANDATORY
#        means something different per tier - on an ephemeral component it
#        means `democtl build` always deploys it; on a persistent one it
#        means it must already exist before build will run at all.
MANDATORY=false

# The bool in terraform.tfvars that turns this on. Required unless
# MANDATORY=true.
ENABLE_VAR=enable___COMPONENT_UNDERSCORE__

# tofu | hooks | tofu+hooks | docs
#   tofu   - has an OpenTofu root module here
#   hooks  - lifecycle scripts only (e.g. a Helm install onto an existing cluster)
#   docs   - inert, never deployed. The template ships as docs so a copy that
#            has not been finished cannot create anything by accident.
KIND=docs

# persistent | ephemeral
#   ephemeral  - billed by the hour. `democtl build` and `democtl destroy`
#                act on exactly this tier. Default for anything with an EC2
#                instance behind it.
#   persistent - free or pennies, created once, survives rebuilds. Managed
#                only by `democtl foundation up|down`.
LIFECYCLE=ephemeral

# Optional. Names the terraform.tfvars variable holding this component's
# hostname, so `democtl urls` and the DNS checks in `democtl orphans` can
# find it without anything being hardcoded in Scripts/.
# HOSTNAME_VAR=hostname___COMPONENT_UNDERSCORE__
