NAME=rancher-manager
DESCRIPTION="Single-node RKE2 + Rancher Manager on SL-Micro"

ORDER=20
DEPENDS_ON="foundation"

# Always deploys when `democtl build` runs - the one product v1 exists to
# demo. ENABLE_VAR is not set: MANDATORY=true means it is ignored.
MANDATORY=true

LIFECYCLE=ephemeral
KIND=tofu+hooks
HOSTNAME_VAR=hostname_rancher
