NAME=foundation
DESCRIPTION="VPC, security groups, SSH key pair, IAM instance profile (persistent)"

# First in every ordering. Nothing else can be built until this exists.
ORDER=10
DEPENDS_ON=""

# MANDATORY on a PERSISTENT component means "must already exist before
# `democtl build` will run", not "build creates it". `democtl foundation up`
# is what creates it, and `democtl build` fails with a pointer to that
# command rather than a confusing OpenTofu error.
MANDATORY=true

# Free or near-free, created once, deliberately outside the build/destroy
# cycle. Tearing the lab down leaves all of this in place so the next build
# is fast and nothing drifts: no re-imported key pair, no IAM
# eventual-consistency waits, no new VPC.
LIFECYCLE=persistent

KIND=tofu
